<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preload" as="image" href="assets/hero.webp"><title>Arusha Wildlife Safaris</title>
<meta name="description" content="Arusha Wildlife Safaris — a Tanzania-based tour operator running private, tailor-made wildlife safaris in Serengeti, Ngorongoro, Tarangire and Zanzibar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Azeret+Mono:wght@400;500;600;700&display=swap">

<style>
/* ============================================================
   ARUSHA WILDLIFE SAFARIS — demo site
   Design: Neo Mirai structure (safari-ui/DESIGN.md) remixed with
   the Nyumbani Collection brand DNA, in the client's green.
   Single visual world by design: Neo Mirai forbids a dark-mode
   switch — night bands are the entire dark budget. Every colour
   is painted explicitly so the page holds on any host ground.
   ============================================================ */
:root{
  color-scheme: only light;

  /* --- grounds (Nyumbani: Plains Paper / Canvas) --- */
  --paper:#F2EFE8;
  --paper-soft:#EAE6DA;
  --paper-deep:#DCD7C6;
  --rice:#F7F5EF;

  /* --- ink --- contrast vs --paper: 13.78 / 9.32 / 5.94 --- */
  --ink:#1F241C;
  --ink-soft:#3A4034;
  --ash:#575D4E;

  --line:#D3CEBE;

  /* --- night bands --- rice 13.55, sage 6.14, gold-bright 7.78 --- */
  --night:#232A1E;
  --night-soft:#333C2B;
  --sage:#A3AA93;

  /* --- interactive signal (Nyumbani olive) --- 6.79 on paper --- */
  --olive:#4C5636;
  --olive-deep:#3A4328;

  /* --- the client's green, from their mark --- leaf-bright 7.20 on night --- */
  --leaf:#6B8F3A;
  --leaf-bright:#9CC24A;

  /* --- editorial signal (Nyumbani savanna gold) --- 2.24 on paper: FILLS
         ONLY. 5.74 on night, 7.78 for gold-bright: text is allowed there. --- */
  --gold:#C79A4B;
  --gold-bright:#DDB76C;

  --focus:#4C5636;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-quart:cubic-bezier(.25,1,.5,1);

  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --font-mono:'Azeret Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;

  --gut:clamp(1.25rem,4.4vw,5.5rem);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100dvh;
  font-family:var(--font-serif);
  font-size:1.0625rem;      /* 17px — Law §6 body floor is 16px */
  line-height:1.62;
  color:var(--ink-soft);
  background:
    radial-gradient(circle at 72% 4%, rgba(199,154,75,.20), transparent 26rem),
    linear-gradient(90deg, rgba(31,36,28,.030) 1px, transparent 1px),
    linear-gradient(0deg,  rgba(31,36,28,.024) 1px, transparent 1px),
    var(--paper);
  background-size:auto,112px 112px,112px 112px,auto;
  /* deliberately NOT background-attachment:fixed - it janks on mobile browsers
     and tiles wrongly on long pages. The 112px graph grid is the paper itself
     and should travel with the paper. */
  background-repeat:no-repeat,repeat,repeat,repeat;
}
/* paper grain */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:.34;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.42'/></svg>");
}
#app{position:relative;z-index:1}

img{max-width:100%;display:block}
a{color:var(--olive);text-underline-offset:.18em}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--focus);outline-offset:4px
}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:500;color:var(--ink)}
p{margin:0}

/* ---------- structural type ---------- */
.eyebrow{
  font-family:var(--font-mono);font-weight:600;
  font-size:.75rem;              /* 12px — Law §6 micro floor */
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--ash);              /* 5.94:1 on paper */
  margin:0 0 1.15rem;
}
.eyebrow--dark{color:var(--gold-bright)}   /* 7.78:1 on night */
.eyebrow--olive{color:var(--olive)}        /* 6.79:1 on paper */

.display{
  font-family:var(--font-display);font-weight:500;
  font-size:clamp(2.1rem,4.6vw,3.5rem);line-height:1.06;letter-spacing:-.005em;
}
.display--xl{font-size:clamp(2.6rem,7.4vw,5.6rem);line-height:1}
.display--sm{font-size:clamp(1.6rem,2.9vw,2.3rem);line-height:1.1}
.lede{font-size:clamp(1.125rem,1.5vw,1.375rem);line-height:1.6;color:var(--ink-soft);max-width:38ch}
.wordmark{
  font-family:var(--font-display);font-weight:500;
  letter-spacing:.26em;text-indent:.26em;text-transform:uppercase;
}
.italic{font-family:var(--font-display);font-style:italic;font-weight:400}

/* ---------- bands ---------- */
.band{padding:clamp(3.4rem,7vw,6.5rem) var(--gut);border-bottom:1px solid var(--line);position:relative}
.band--soft{background:var(--paper-soft)}
.band--deep{background:var(--paper-deep)}
.band--night{background:var(--night);border-bottom-color:var(--night-soft)}
.band--night h1,.band--night h2,.band--night h3,.band--night h4{color:var(--rice)}
.band--night p{color:var(--sage)}
.band--tight{padding-block:clamp(2.2rem,4vw,3.4rem)}
.wrap{max-width:78rem;margin-inline:auto}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:.7rem;
  font-family:var(--font-mono);font-weight:700;
  font-size:.8125rem;            /* 13px — Law §6 interactive floor */
  letter-spacing:.16em;text-transform:uppercase;
  padding:1.05rem 1.9rem;min-height:44px;border:1px solid transparent;
  text-decoration:none;cursor:pointer;border-radius:0;
  transition:background .18s var(--ease),color .18s var(--ease),transform .24s var(--ease),border-color .18s var(--ease);
}
.btn:hover{transform:translateY(-2px)}
.btn--primary{background:var(--olive);color:var(--rice)}          /* 7.16:1 */
.btn--primary:hover{background:var(--olive-deep)}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn--ghost:hover{background:var(--ink);color:var(--rice)}
.btn--onnight{background:var(--gold-bright);color:var(--night)}   /* 7.78:1 */
.btn--onnight:hover{background:var(--rice)}
.btn--ghostnight{background:transparent;color:var(--rice);border-color:var(--sage)}
.btn--ghostnight:hover{background:var(--rice);color:var(--night)}
.btn .arw{width:1.45rem;height:1.45rem;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:.75rem;flex:none}

.tlink{
  font-family:var(--font-mono);font-weight:600;font-size:.8125rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--olive);
  text-decoration:none;display:inline-flex;align-items:center;gap:.6rem;min-height:44px;
  transition:color .18s var(--ease),transform .24s var(--ease);
}
.tlink:hover{color:var(--olive-deep);transform:translateX(.2rem)}
.tlink--night{color:var(--gold-bright)}
.tlink--night:hover{color:var(--rice)}
.tlink .arw{width:1.4rem;height:1.4rem;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:.75rem;flex:none}


/* ---------- header ---------- */
.hdr{
  position:sticky;top:0;z-index:50;background:var(--night);
  border-bottom:1px solid var(--night-soft);
}
.hdr__in{display:flex;align-items:center;gap:1.25rem;padding:.7rem var(--gut);max-width:100rem;margin-inline:auto}
.lock{display:flex;align-items:center;gap:.75rem;text-decoration:none;flex:none}
.lock svg{width:42px;height:42px;flex:none}
.lock__t{display:flex;flex-direction:column;line-height:1}
.lock__n{font-family:var(--font-display);font-weight:600;font-size:1.24rem;letter-spacing:.16em;text-indent:.16em;text-transform:uppercase;color:var(--rice)}
.lock__s{font-family:var(--font-mono);font-weight:500;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--leaf-bright);margin-top:.34rem}
.nav{display:flex;gap:.15rem;margin-left:auto;flex-wrap:wrap}
.nav a{
  font-family:var(--font-mono);font-weight:500;font-size:.8125rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--sage);
  text-decoration:none;padding:.7rem .78rem;min-height:44px;display:inline-flex;align-items:center;
  position:relative;transition:color .18s var(--ease);
}
.nav a:hover,.nav a[aria-current="page"]{color:var(--rice)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:.78rem;right:.78rem;bottom:.5rem;height:2px;background:var(--leaf-bright)}
.hdr .btn{padding:.85rem 1.35rem;flex:none}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--sage);color:var(--rice);width:46px;height:46px;cursor:pointer;font-size:1.1rem;border-radius:0}

/* ---------- hero ----------
   Full-bleed footage with the copy overlaid. The scrim is a NEUTRAL near-black
   (10,10,9) on purpose - not the green --night token - so the footage keeps its
   own colour and the hero reads as film, not as a tinted panel.
   Law 5a: alpha floor is .72 at the top of the copy block. Composited over a
   pure-white frame pixel that is L=.083, where --rice measures 7.1:1. Verified
   from screenshot pixels behind hidden glyphs, per device. */
.hero{position:relative;display:grid;align-items:end;min-height:clamp(36rem,94vh,62rem);
  border-bottom:1px solid var(--line);overflow:hidden;background:#0B0B0A}
.hero--page{min-height:clamp(26rem,68vh,44rem)}
.hero__media{position:absolute;inset:0;overflow:hidden}
.hero__media img,.hero__media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* the cheetah still sits underneath and is what you see if the video never
   plays - blocked autoplay, decode failure, reduced motion, or a dead connection */
.hero__media video{opacity:0;transition:opacity .9s var(--ease)}
.hero__media video.on{opacity:1}
/* The frame stays BRIGHT. Instead of veiling the whole hero, the global pass is
   a light vignette for depth only, and the darkening that carries the type is a
   tight ellipse anchored to the bottom-left corner where the copy actually sits
   (Law 5a: "a scrim sized to where the text really ends"). Everything right of
   ~60% keeps the footage at full luminance. */
.hero__scrim{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to top, rgba(10,10,9,.22) 0%, rgba(10,10,9,.08) 24%, rgba(10,10,9,0) 46%)}
/* The darkening lives on the COPY BLOCK, not the frame: strong across the lower
   third where the type sits, gone entirely above it, and eased off to the right
   so the far side of the shot stays open. Alpha at the eyebrow (top of the
   block) is ~.70, which puts --rice at 8:1 even over a blown-out sky pixel. */
.hero__in::before{
  content:"";position:absolute;inset:-4rem 0 -1rem 0;pointer-events:none;z-index:0;
  background:linear-gradient(to top, rgba(8,9,7,.94) 0%, rgba(8,9,7,.90) 40%, rgba(8,9,7,.83) 66%,
                                     rgba(8,9,7,.58) 84%, rgba(8,9,7,.18) 95%, rgba(8,9,7,0) 100%);
  /* masked away toward the right, so the scrim only exists under the type and
     the far side of the frame keeps the footage at full brightness */
  -webkit-mask-image:linear-gradient(to right,#000 0%,#000 58%,rgba(0,0,0,.62) 74%,rgba(0,0,0,0) 92%);
  mask-image:linear-gradient(to right,#000 0%,#000 58%,rgba(0,0,0,.62) 74%,rgba(0,0,0,0) 92%);
}
.hero__in > *{position:relative;z-index:1}
/* pure margin on top of the measured scrim - costs the photograph nothing */
.hero h1,.hero__sub,.hero__in .eyebrow,.hero__strip{text-shadow:0 1px 14px rgba(8,9,7,.55)}
.hero__in{position:relative;z-index:2;padding:clamp(2.4rem,5vw,4.4rem) var(--gut) clamp(2.2rem,3.6vw,3.2rem);
  max-width:100rem;margin-inline:auto;width:100%}
.hero h1{color:var(--rice);max-width:16ch}
.hero__sub{color:var(--rice);opacity:.93;max-width:44ch;margin-top:1.4rem;font-size:clamp(1.0625rem,1.5vw,1.32rem)}
.hero__cta{display:flex;gap:.85rem;flex-wrap:wrap;margin-top:2.2rem}
.hero__strip{
  display:flex;gap:clamp(1rem,3vw,3rem);flex-wrap:wrap;margin-top:2.6rem;padding-top:1.4rem;
  border-top:1px solid rgba(247,245,239,.28);
  font-family:var(--font-mono);font-weight:500;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rice);opacity:.9;
}

/* ---------- grids ---------- */
.grid{display:grid;gap:clamp(1.1rem,2vw,1.7rem)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split{display:grid;grid-template-columns:0.86fr 1.14fr;gap:clamp(2rem,5vw,5rem);align-items:start}
.split--even{grid-template-columns:1fr 1fr}

/* Neo Mirai forbids floating cards; these are hairline-bounded tiles,
   radius 0, shadow only as a hover response (DESIGN.md 10). */
.tile{display:flex;flex-direction:column;background:var(--rice);border:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
.tile:hover{transform:translateY(-4px);box-shadow:0 16px 44px rgba(31,36,28,.16);border-color:var(--olive)}
.tile__img{aspect-ratio:4/3;overflow:hidden;background:var(--paper-deep)}
.tile__img img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease-quart)}
.tile:hover .tile__img img{transform:scale(1.06)}
.tile__b{padding:1.35rem 1.4rem 1.5rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.tile__meta{font-family:var(--font-mono);font-weight:500;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.tile__t{font-family:var(--font-display);font-weight:500;font-size:1.5rem;line-height:1.14;color:var(--ink)}
.tile__d{font-size:1rem;line-height:1.55;color:var(--ink-soft)}
.tile__f{margin-top:auto;padding-top:.9rem;border-top:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.price{font-family:var(--font-mono);font-weight:700;font-size:.875rem;letter-spacing:.06em;color:var(--olive);font-variant-numeric:tabular-nums}
.price small{font-family:var(--font-mono);font-weight:500;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);display:block;margin-bottom:.2rem}
.go{font-family:var(--font-mono);font-weight:600;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}

.dest{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;text-decoration:none;border:1px solid var(--line)}
.dest img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease-quart)}
.dest:hover img{transform:scale(1.07)}
.dest__v{position:absolute;inset:0;background:linear-gradient(to top,rgba(23,28,19,.90) 0%,rgba(23,28,19,.58) 34%,rgba(23,28,19,.10) 66%,transparent 100%)}
.dest__b{position:absolute;left:0;right:0;bottom:0;padding:1.3rem 1.35rem;display:flex;flex-direction:column;gap:.42rem}
.dest__n{display:block;font-family:var(--font-display);font-weight:500;font-size:1.6rem;line-height:1.12;color:var(--rice)}
.dest__k{display:block;font-family:var(--font-mono);font-weight:500;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-bright)}
.dest__s{display:block;font-size:.98rem;line-height:1.45;color:var(--rice);opacity:.92}

.reason{display:flex;gap:1.1rem;align-items:flex-start;padding-top:1.4rem;border-top:1px solid var(--line)}
.reason__n{font-family:var(--font-mono);font-weight:700;font-size:.75rem;letter-spacing:.1em;color:var(--olive);padding-top:.28rem;flex:none;font-variant-numeric:tabular-nums}
.reason h3{font-family:var(--font-display);font-size:1.4rem;line-height:1.16;margin-bottom:.35rem}
.reason p{font-size:1rem;color:var(--ink-soft)}
/* Law 4 - when the ground changes, EVERY text colour on it changes with it.
   .reason p ties with .band--night p on specificity and would otherwise win by
   source order, dropping paper ink onto the night band at 1.37:1. */
.band--night .reason{border-top-color:var(--night-soft)}
.band--night .reason__n{color:var(--gold-bright)}
.band--night .reason p{color:var(--sage)}        /* 6.14:1 on --night */
.band--night .tile__d,.band--night .lede{color:var(--sage)}

.mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem}
.mosaic figure{margin:0;position:relative;overflow:hidden;aspect-ratio:1}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease-quart)}
.mosaic figure:hover img{transform:scale(1.07)}
.mosaic .w2{grid-column:span 2}
.mosaic .h2{grid-row:span 2;aspect-ratio:auto}

.day{display:grid;grid-template-columns:minmax(11rem,17rem) 1fr;gap:clamp(1.2rem,3vw,2.6rem);padding:1.7rem 0;border-top:1px solid var(--line)}
.day__img{aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line)}
.day__img img{width:100%;height:100%;object-fit:cover}
.day__n{font-family:var(--font-mono);font-weight:700;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--olive);margin-bottom:.5rem}
.day h3{font-family:var(--font-display);font-size:1.55rem;line-height:1.12;margin-bottom:.55rem}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.facts div{padding:1.05rem 1.1rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{font-family:var(--font-mono);font-weight:500;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);margin-bottom:.4rem}
.facts dd{margin:0;font-family:var(--font-display);font-size:1.28rem;line-height:1.2;color:var(--ink)}

.route{display:flex;flex-wrap:wrap;align-items:center;gap:.55rem;font-family:var(--font-mono);font-weight:600;font-size:.8125rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.route span{background:var(--paper-deep);border:1px solid var(--line);padding:.6rem .85rem}
.route i{color:var(--olive);font-style:normal}

.ticks{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.ticks li{display:flex;gap:.7rem;align-items:flex-start;font-size:1rem}
.ticks i{font-style:normal;color:var(--olive);flex:none;font-weight:700}
.ticks--no i{color:var(--ash)}

.quote{border-top:1px solid var(--line);padding-top:1.4rem;display:flex;flex-direction:column;gap:.9rem}
.quote p{font-family:var(--font-display);font-size:1.32rem;line-height:1.4;color:var(--ink)}
.quote footer{font-family:var(--font-mono);font-weight:500;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}

.form{display:grid;gap:1.15rem}
.field{display:grid;gap:.45rem}
.field label{font-family:var(--font-mono);font-weight:600;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.field input,.field select,.field textarea{
  font-family:var(--font-serif);font-size:1.0625rem;color:var(--ink);
  background:var(--rice);border:1px solid var(--line);border-radius:0;padding:.85rem .9rem;min-height:46px;width:100%;
}
.field textarea{min-height:7rem;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:block;font-family:var(--font-mono);font-weight:500;font-size:.8125rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--rice);border:1px solid var(--line);padding:.72rem .9rem;min-height:44px;display:flex;align-items:center;transition:background .18s,color .18s,border-color .18s}
.chip input:checked+span{background:var(--olive);color:var(--rice);border-color:var(--olive)}
.chip input:focus-visible+span{outline:3px solid var(--focus);outline-offset:3px}

.ftr{background:var(--night);color:var(--sage);padding:clamp(3rem,6vw,4.6rem) var(--gut) 2rem}
.ftr h4{font-family:var(--font-mono);font-weight:600;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-bright);margin-bottom:1rem}
.ftr a{color:var(--sage);text-decoration:none;display:block;padding:.34rem 0;font-size:1rem;transition:color .18s}
.ftr a:hover{color:var(--rice)}
.ftr__grid{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:clamp(1.4rem,3vw,2.6rem);max-width:78rem;margin-inline:auto}
.ftr__end{max-width:78rem;margin:2.6rem auto 0;padding-top:1.5rem;border-top:1px solid var(--night-soft);display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;font-family:var(--font-mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}

.note{background:var(--paper-deep);border:1px solid var(--line);border-left:4px solid var(--gold);padding:1.15rem 1.3rem;font-size:1rem;color:var(--ink-soft)}
.note strong{color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

   NEO MIRAI LAYER

.hero__rail{
  position:absolute;right:var(--gut);top:0;bottom:0;z-index:3;

/* the rail now sits over UNSCRIMMED footage, so it carries its own legibility */
.hero__rail b{
  writing-mode:vertical-rl;font-family:var(--font-mono);font-weight:600;
  font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--rice);
  text-shadow:0 1px 10px rgba(8,9,7,.9),0 0 3px rgba(8,9,7,.75);
}
.hero__rail i{display:block;width:1px;height:clamp(3rem,7vw,6.5rem);
  background:rgba(247,245,239,.75);box-shadow:0 0 6px rgba(8,9,7,.6)}
/* the short page heroes cannot fit the full stack - it clipped at the top */

  line-height:1.15;color:var(--gold-bright);

     lands, instead of floating over whatever the footage happens to be doing */
  background:rgba(8,9,7,.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}

/* --- section head: index, label, hairline. Replaces the bare eyebrow. --- */
.sect{display:grid;grid-template-columns:auto auto 1fr;gap:.9rem;align-items:center;margin-bottom:1.15rem}

.car__ui{display:flex;align-items:center;gap:.9rem;margin-top:1.5rem;flex-wrap:wrap}
.car__btn{width:2.75rem;height:2.75rem;min-height:44px;min-width:44px;border:1px solid var(--ink);background:transparent;

    ? '<div class="hero__media"' + st + '>' +
        '<img src="' + (A.cheetahhero || '') + '" alt="Two cheetah on the open plains of the Serengeti" fetchpriority="high">' +
        // preload="none" and no <source> until JS asks for it: the HD file must
        // never block first paint or the load event. The poster is the same
        // retina cheetah still that sits underneath, so nothing pops.
        '<video id="heroVid" muted loop playsinline preload="none" poster="' + (A.cheetahhero || '') + '" ' +
          'data-src="' + (A.herovideo || '') + '"></video>' +
      '</div>'
    : '<div class="hero__media"' + st + '><img src="' + (A[slug] || '') + '" alt="' + esc(alt) + '" loading="eager" fetchpriority="high"></div>';

<script>
/* ---------------- router ---------------- */
const TITLES = {
  '/': 'Arusha Wildlife Safaris — private tailor-made Tanzania safaris',
  '/safaris': 'Tanzania safari itineraries — Arusha Wildlife Safaris',
  '/destinations': 'Tanzania safari destinations — Arusha Wildlife Safaris',
  '/experiences': 'Safari experiences in Tanzania — Arusha Wildlife Safaris',
  '/about': 'About Arusha Wildlife Safaris — Arusha, Tanzania',
  '/why-us': 'Why travel with Arusha Wildlife Safaris',
  '/plan': 'Plan my safari — Arusha Wildlife Safaris',
  '/demo-notes': 'Demo notes and image credits — Arusha Wildlife Safaris'
};

function resolve(route) {
  const p = route.split('/').filter(Boolean);
  if (p.length === 0) return { html: pageHome(), title: TITLES['/'] };
  if (p[0] === 'safaris') return p[1]
    ? { html: pageSafari(p[1]), title: (SAFARIS.find(s => s.slug === p[1]) || {}).title + ' — ' + CO.name }
    : { html: pageSafaris(), title: TITLES['/safaris'] };
  if (p[0] === 'destinations') return p[1]
    ? { html: pageDest(p[1]), title: (DESTS.find(d => d.slug === p[1]) || {}).name + ' — ' + CO.name }
    : { html: pageDests(), title: TITLES['/destinations'] };
  if (p[0] === 'experiences') return { html: pageExps(), title: TITLES['/experiences'] };
  if (p[0] === 'about') return { html: pageAbout(), title: TITLES['/about'] };
  if (p[0] === 'why-us') return { html: pageWhy(), title: TITLES['/why-us'] };
  if (p[0] === 'plan') return { html: pagePlan(), title: TITLES['/plan'] };
  if (p[0] === 'demo-notes') return { html: pageNotes(), title: TITLES['/demo-notes'] };
  return { html: pageMissing(), title: 'Not found — ' + CO.name };
}

let firstPaint = true;
function render() {
  const route = (location.hash || '#/').slice(1) || '/';
  const r = resolve(route);
  document.title = r.title;
  el('#app').innerHTML = header(route) + '<main>' + r.html + '</main>' + footer();
  if (!firstPaint) window.scrollTo(0, 0);
  firstPaint = false;
  wire();
  observe();
}

/* ---------------- interactions ---------------- */
function wire() {
  const burger = el('#burger'), nav = el('#nav');
  if (burger) burger.addEventListener('click', () => {
    const open = nav.classList.toggle('open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  if (nav) nav.addEventListener('click', (e) => {
    if (e.target.tagName === 'A') { nav.classList.remove('open'); if (burger) burger.setAttribute('aria-expanded', 'false'); }
  });

  // Carousel. The viewport is a native scroll-snap container, so swipe already
  // works; this only adds arrows, dots and the counter on top of it.
  document.querySelectorAll('.car').forEach((car) => {
    const vp = car.querySelector('.car__vp');
    const track = car.querySelector('.car__track');
    const dots = car.querySelector('.car__dots');
    const cnt = car.querySelector('.car__cnt');
    const items = [...track.children];
    if (!items.length) return;

    const perView = () => {
      const w = items[0].getBoundingClientRect().width;
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return Math.max(1, Math.round((vp.clientWidth + gap) / (w + gap)));
    };
    const pages = () => Math.max(1, items.length - perView() + 1);
    const step = () => {
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return items[0].getBoundingClientRect().width + gap;
    };
    const index = () => Math.round(vp.scrollLeft / step());

    function paint() {
      const n = pages(), i = Math.min(index(), n - 1);
      if (dots.children.length !== n) {
        dots.innerHTML = '';
        for (let k = 0; k < n; k++) {
          const b = document.createElement('button');
          b.className = 'car__dot'; b.type = 'button';
          b.setAttribute('aria-label', 'Go to slide ' + (k + 1));
          b.addEventListener('click', () => vp.scrollTo({ left: k * step(), behavior: 'smooth' }));
          dots.appendChild(b);
        }
      }
      [...dots.children].forEach((d, k) => d.setAttribute('aria-current', k === i ? 'true' : 'false'));
      cnt.textContent = String(Math.min(i + perView(), items.length)).padStart(2, '0') + ' / ' + String(items.length).padStart(2, '0');
      car.querySelectorAll('.car__btn').forEach((b) => {
        const d = Number(b.dataset.dir);
        b.disabled = d < 0 ? vp.scrollLeft < 4 : vp.scrollLeft > vp.scrollWidth - vp.clientWidth - 4;
      });
    }

    car.querySelectorAll('.car__btn').forEach((b) =>
      b.addEventListener('click', () => vp.scrollBy({ left: Number(b.dataset.dir) * step(), behavior: 'smooth' })));
    let t; vp.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(paint, 90); }, { passive: true });
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(paint, 140); });
    paint();
  });

  // Hero video: reveal ONLY on a real 'playing' event. If autoplay is blocked,
  // the file fails to decode, the connection dies, or the visitor asked for
  // reduced motion, the cheetah photograph underneath is what stays on screen.
  const vid = el('#heroVid');
  if (vid) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      vid.removeAttribute('autoplay');
      try { vid.pause(); } catch (e) {}
    } else {
      vid.addEventListener('playing', () => vid.classList.add('on'));
      ['error', 'abort', 'stalled', 'emptied'].forEach(ev =>
        vid.addEventListener(ev, () => vid.classList.remove('on')));

      // Attach the source only once the page is painted and idle, so the HD
      // file downloads behind the poster instead of in front of it.
      let started = false;
      const start = () => {
        if (started) return; started = true;
        vid.preload = 'auto';
        const s = document.createElement('source');
        s.src = vid.dataset.src; s.type = 'video/mp4';
        vid.appendChild(s);
        vid.load();
        const pr = vid.play();
        if (pr && pr.catch) pr.catch(() => vid.classList.remove('on'));
      };
      const idle = window.requestIdleCallback || ((f) => setTimeout(f, 320));
      if (document.readyState === 'complete') idle(start, { timeout: 1800 });
      else window.addEventListener('load', () => idle(start, { timeout: 1800 }), { once: true });

      // pause the loop while the hero is off-screen
      if ('IntersectionObserver' in window) {
        new IntersectionObserver((es) => es.forEach(e => {
          if (e.isIntersecting) { if (started) { const q = vid.play(); if (q && q.catch) q.catch(() => {}); } }
          else { try { vid.pause(); } catch (err) {} }
        }), { threshold: 0.01 }).observe(vid);
      }
    }
  }

  const form = el('#planform');
  if (!form) return;
  let step = 1;
  const label = el('#stepLabel'), back = el('#backBtn'), next = el('#nextBtn'), send = el('#sendBtn');
  const names = { 1: 'About you', 2: 'Your trip', 3: 'What you want to see' };
  const show = () => {
    form.querySelectorAll('[data-step]').forEach(s => { s.hidden = Number(s.dataset.step) !== step; });
    label.textContent = 'Step ' + step + ' of 3 · ' + names[step];
    back.hidden = step === 1;
    next.hidden = step === 3;
    send.hidden = step !== 3;
  };
  next.addEventListener('click', () => { if (step < 3) { step++; show(); form.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
  back.addEventListener('click', () => { if (step > 1) { step--; show(); form.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const d = new FormData(form);
    const many = (k) => d.getAll(k).join(', ');
    const lines = [
      'Safari enquiry from the website',
      '',
      'Name: ' + (d.get('name') || '—'),
      'Email: ' + (d.get('email') || '—'),
      'Phone: ' + (d.get('phone') || '—'),
      'Country: ' + (d.get('country') || '—'),
      'Travellers: ' + (d.get('adults') || '—') + ' adults, children: ' + (d.get('children') || 'none'),
      'Dates: ' + (d.get('dates') || '—'),
      'Length: ' + (d.get('length') || '—'),
      'Places: ' + (many('places') || '—'),
      'Style: ' + (many('style') || '—'),
      'Accommodation: ' + (d.get('accommodation') || '—'),
      'Budget: ' + (d.get('budget') || '—'),
      'Notes: ' + (d.get('notes') || '—')
    ];
    window.open(waLink(lines.join('\n')), '_blank', 'noopener');
  });
  show();
}

/* entrance motion */
let io;
function observe() {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = document.querySelectorAll('.rise');
  if (reduce || !('IntersectionObserver' in window)) { items.forEach(i => i.classList.add('in')); return; }
  if (io) io.disconnect();
  io = new IntersectionObserver((entries) => {
    entries.forEach((en, i) => {
      if (en.isIntersecting) { setTimeout(() => en.target.classList.add('in'), Math.min(i, 6) * 90); io.unobserve(en.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  items.forEach(i => io.observe(i));
}

window.addEventListener('hashchange', render);
render();
</script>
